[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oma2fa"
version = "0.2.0"
description = "A privacy-first 2FA code picker for Omarchy"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jon Kinney" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
  "Topic :: Security",
]

[project.scripts]
oma2fa = "oma2fa.cli:main"

[tool.setuptools.packages.find]
include = ["oma2fa*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
